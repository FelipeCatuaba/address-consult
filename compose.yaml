services:
  postgres:
    image: postgres:16-alpine
    container_name: address-consult-postgres
    environment:
      POSTGRES_DB: address_consult
      POSTGRES_USER: address_user
      POSTGRES_PASSWORD: address_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: address-consult-wiremock
    command: ["--verbose"]
    ports:
      - "8081:8080"
    volumes:
      - ./src/main/resources/wiremock/mappings:/home/wiremock/mappings

volumes:
  postgres_data:

