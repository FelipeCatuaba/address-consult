name: Publish Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/address-consult:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/address-consult:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eux

            if [ ! -d "$HOME/address-consult/.git" ]; then
              git clone "${{ secrets.REPO_CLONE_URL }}" "$HOME/address-consult"
            fi

            cd "$HOME/address-consult"
            git fetch --all
            git checkout master
            git reset --hard origin/master

            if ! command -v aws >/dev/null 2>&1; then
              sudo dnf install -y awscli
            fi

            if ! command -v jq >/dev/null 2>&1; then
              sudo dnf install -y jq
            fi

            aws secretsmanager get-secret-value \
              --secret-id "${{ secrets.EC2_APP_SECRET_ID }}" \
              --region "${{ secrets.AWS_REGION }}" \
              --query SecretString \
              --output text \
              | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' > .env.ec2

            for key in APP_IMAGE APP_TAG APP_PORT DB_NAME DB_USERNAME DB_PASSWORD; do
              if ! grep -q "^${key}=" .env.ec2; then
                echo "Missing required key in secret: ${key}"
                exit 1
              fi
            done

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            set -a
            . ./.env.ec2
            set +a

            if docker compose version >/dev/null 2>&1; then
              docker compose pull app
              docker compose up -d
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose pull app
              docker-compose up -d
            else
              echo "Docker Compose is not installed on EC2"
              exit 1
            fi
