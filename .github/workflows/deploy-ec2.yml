name: Deploy To EC2

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eux

            if [ ! -d "$HOME/address-consult/.git" ]; then
              git clone "${{ secrets.REPO_CLONE_URL }}" "$HOME/address-consult"
            fi

            cd "$HOME/address-consult"
            git fetch --all
            git checkout master
            git reset --hard origin/master

            if ! command -v aws >/dev/null 2>&1; then
              sudo dnf install -y awscli
            fi

            if ! command -v jq >/dev/null 2>&1; then
              sudo dnf install -y jq
            fi

            aws secretsmanager get-secret-value \
              --secret-id "${{ secrets.EC2_APP_SECRET_ID }}" \
              --region "${{ secrets.AWS_REGION }}" \
              --query SecretString \
              --output text \
              | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' > .env.ec2

            for key in APP_IMAGE APP_TAG APP_PORT DB_NAME DB_USERNAME DB_PASSWORD; do
              if ! grep -q "^${key}=" .env.ec2; then
                echo "Missing required key in secret: ${key}"
                exit 1
              fi
            done

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose --env-file .env.ec2 pull app
            docker compose --env-file .env.ec2 up -d
